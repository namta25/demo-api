apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/managed-by: styx
        app.kubernetes.io/name: repo
    name: repo
    namespace: styx-system
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: repo
    template:
        metadata:
            labels:
                app.kubernetes.io/name: repo
        spec:
            containers:
                - image: PLACEHOLDER:latest
                  name: repo
                  ports:
                    - containerPort: 8080
                      name: http
                  readinessProbe:
                    httpGet:
                        path: /health
                        port: 8080
                    initialDelaySeconds: 3
